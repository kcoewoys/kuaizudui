services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: kuaizudui
      MYSQL_USER: app
      MYSQL_PASSWORD: app-password
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      # 用真实客户端连接（SELECT 1）探活。mysqladmin ping 在服务端还没真正
      # 接受客户端握手时也会返回成功，会让 api 过早启动。
      test: ["CMD", "mysql", "-h", "127.0.0.1", "-uroot", "-proot", "--connect-timeout=3", "-e", "SELECT 1"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    build: .
    environment:
      TZ: Asia/Shanghai
      APP_SERVER_MODE: release
      APP_MYSQL_DSN: app:app-password@tcp(mysql:3306)/kuaizudui?charset=utf8mb4&parseTime=True&loc=Local
      APP_REDIS_ADDRESS: redis:6379
      APP_ADMIN_TOKEN_SECRET: replace-this-before-production
    volumes:
      - ./config/config.yaml:/app/config/config.yaml:ro
      - qrcode_uploads:/app/uploads
    ports:
      - "8080:8080"
    # MySQL 未就绪等瞬时故障下自动拉起，避免 api 退出后 8080 一直无人监听
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  mysql_data:
  redis_data:
  qrcode_uploads:
